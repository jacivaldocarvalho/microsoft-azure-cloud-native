name: Lab 1 quality

on:
  pull_request:
    paths:
      - "azure-fundamentals/lab1-ecommerce-azure/**"
      - ".github/workflows/lab1-quality.yml"
  push:
    paths:
      - "azure-fundamentals/lab1-ecommerce-azure/**"
      - ".github/workflows/lab1-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab1-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: azure-fundamentals/lab1-ecommerce-azure

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: azure-fundamentals/lab1-ecommerce-azure/app/requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Install Python dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run offline validation
        env:
          PYTHON_BIN: python
        run: ./scripts/validate.sh
